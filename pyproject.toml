[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding of LLM output into schema-valid function calls"
readme = "README.md"
authors = [
    { name = "ASMAE MOUNCIF" }
]
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

# This is an application, not a library, so there is nothing to build or
# install. Without this, uv builds the project on every command and leaves a
# stray src/call_me_maybe.egg-info directory behind.
[tool.uv]
package = false

# The SDK lives in this repository. A plain path source is enough; a uv
# workspace is only needed when several packages are developed together.
[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

# mypy cannot see inside the SDK's own package, so point it at the directory
# and do not type-check the SDK itself.
[tool.mypy]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "silent"
ignore_errors = true
