[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained-decoding function calling with a small LLM"
readme = "README.md"
authors = [
    { name = "ASMAE MOUNCIF", email = "158608762+AsmaeMouncif@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # required by llm_sdk on CUDA machines, where it uses device_map="auto"
    "accelerate>=1.0.0",
    "llm-sdk",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

# the provided SDK must stay importable for `mypy .` but is not ours to fix
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
